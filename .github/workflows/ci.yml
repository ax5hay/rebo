name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --frozen --all-extras
      - run: uv run pytest -q
      - run: uvx ruff check src tests tools mocks --select F,E9,B --ignore E501,B008,B905
