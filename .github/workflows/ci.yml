name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --frozen --all-extras
      - run: uv run pytest -q
      - run: uvx ruff check src tests tools mocks --select F,E9,B --ignore E501,B008,B905

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: reportsbot
          POSTGRES_PASSWORD: reportsbot
          POSTGRES_DB: reportsbot
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U reportsbot" --health-interval 2s --health-retries 30
    env:
      REPORTSBOT_TEST_STATE_URL: postgresql://reportsbot:reportsbot@127.0.0.1:5433/reportsbot
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --frozen --all-extras
      - run: uv run pytest -q
