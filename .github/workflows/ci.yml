name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --frozen --all-extras
      - run: uv run pytest -q
      - run: uvx ruff check src tests tools mocks --select F,E9,B --ignore E501,B008,B905

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_USER: rebo
          POSTGRES_PASSWORD: rebo
          POSTGRES_DB: rebo
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U rebo" --health-interval 2s --health-retries 30
    env:
      REBO_TEST_STATE_URL: postgresql://rebo:rebo@127.0.0.1:5433/rebo
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --frozen --all-extras
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/setup-node@v7
        with: {node-version: 24}
      - run: uv sync --frozen --all-extras
        working-directory: .
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/setup-node@v7
        with: {node-version: 24}
      - run: uv export --frozen --all-extras --no-hashes --no-emit-project > requirements-audit.txt
      - run: uvx pip-audit -r requirements-audit.txt --no-deps --disable-pip
      - run: npm audit --audit-level=high
        working-directory: web
