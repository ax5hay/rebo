[project]
name = "rebo"
version = "0.1.0"
description = "ReBo: a self-learning natural-language reports bot for any relational database."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic-ai-slim[openrouter,openai,anthropic,google,ag-ui]>=2.58",
    "sqlglot>=30.24",
    "sqlalchemy>=2.0.48",
    "pymysql>=1.2",
    "fastapi>=0.138",
    "uvicorn>=0.42",
    "nicegui>=3.18",
    "numpy>=2.0",
    "pydantic-settings>=2.10",
    "pyyaml>=6.0",
    "pyjwt>=2.10",
    "httpx2>=2.15",
    "alembic>=1.20",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[project.optional-dependencies]
embed = ["fastembed>=0.9"]
synth = ["faker>=40.0"]
mcp = ["fastmcp>=4.1"]
postgres = ["psycopg[binary]>=3.3"]
otel = []  # tracing is part of the core install now; kept so `--extra otel` keeps working

[project.scripts]
rebo = "rebo.cli:main"

[dependency-groups]
dev = ["pytest>=8.4", "pytest-asyncio>=1.4", "pydantic-evals>=2.58", "jsonschema>=4.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rebo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
# fastembed 0.9.0 caps pillow < 13, but every Pillow < 13 has the advisories fixed in 13.0.0 (heap
# overflow in JPEG decoding and others). ReBo embeds text only; checked that fastembed text embeddings
# work with Pillow 13. Remove when fastembed allows 13.
override-dependencies = ["pillow>=13.0.0"]

