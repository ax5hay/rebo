[project]
name = "reportsbot"
version = "0.1.0"
description = "Self-learning natural-language reports bot for any relational database."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic-ai-slim[openrouter,openai,anthropic,google,ag-ui]>=2.58",
    "sqlglot>=30.24",
    "sqlalchemy>=2.0.48",
    "pymysql>=1.2",
    "fastapi>=0.138",
    "uvicorn>=0.42",
    "nicegui>=3.18",
    "numpy>=2.0",
    "pydantic-settings>=2.10",
    "pyyaml>=6.0",
    "pyjwt>=2.10",
    "httpx2>=2.15",
    "alembic>=1.20",
]

[project.optional-dependencies]
embed = ["fastembed>=0.9"]
synth = ["faker>=40.0"]
mcp = ["fastmcp>=4.1"]
postgres = ["psycopg[binary]>=3.3"]
otel = ["opentelemetry-sdk>=1.30", "opentelemetry-exporter-otlp-proto-http>=1.30"]

[project.scripts]
reportsbot = "reportsbot.cli:main"

[dependency-groups]
dev = ["pytest>=8.4", "pytest-asyncio>=1.4", "pydantic-evals>=2.58"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reportsbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
