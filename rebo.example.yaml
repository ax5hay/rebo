# rebo.yaml — the whole configuration. Copy to rebo.yaml and edit.
# Everything about what the data *means* is learned from the database and from people.
# Secrets never go here: set them as environment variables (see the bottom of this file).

database: mysql+pymysql://reports_ro:reports_ro@127.0.0.1:3307/jms   # read-only user
# database_role: "{user}"                  # PostgreSQL: run each person's queries as their own role (RLS)

models:                                    # "<provider>:<model>"
  agent: openrouter:anthropic/claude-sonnet-5.5
  fast: openrouter:anthropic/claude-haiku-5.5
  escalate: ""                             # stronger model for turns the agent model fails, e.g.
                                           # openrouter:anthropic/claude-sonnet-5.5 (cost cascade)
  fallback: []                             # tried in order if the agent model's API is down, e.g.
                                           # [google:gemini-3.8-flash, lmstudio:<local model id>]
# lmstudio_url: http://127.0.0.1:1234/v1   # only for "lmstudio:" models (this is the default)

state_dir: data                            # the bot's memory (back this up)
state_url: ""                              # or postgresql://user:pw@host/db for the memory (extra "postgres")

limits:
  rows: 500                                # rows returned per report
  probe_rows: 20                           # rows per exploratory query
  query_timeout_s: 30
  tool_calls: 25                           # per user turn
  cost_per_turn_usd: 0                     # stop a turn that would cost more (list prices); 0 = no cap
  per_user_per_minute: 0                   # questions per person per minute; 0 = no limit
# public demo guardrails (off by default): limits.daily_budget_usd, limits.per_visitor_per_minute, auth.max_role
# checks:
#   agreement: false                       # true: 2 extra queries from the fast model check unsure new reports
#   shape: false                           # true: offer saved reports whose query has the same shape

allowed_tables: []                         # empty = every table the database user can read
protected_columns: ""                      # regex on table.column, added to auto-detected secrets

sharing:
  threshold: 3                             # people agreeing before something is proposed for everyone

embeddings: true                           # local vectors ("embed" extra); false; a model name; or a TEI URL

auth:
  mode: headers                            # headers (X-User-* from a trusted gateway) | jwt
  # issuer: orchid                         # expected "iss" claim when mode is jwt (this is the default)

adapters: []                               # host contracts to expose, e.g. [jms] (needs auth.mode jwt)
notify_url: ""                             # optional webhook for requests and shared/stale items

# Secrets (environment variables only):
#   OPENROUTER_API_KEY   for openrouter:   (REBO_OPENROUTER_API_KEY also accepted)
#   ANTHROPIC_API_KEY    for anthropic:
#   GEMINI_API_KEY       for google:       (GOOGLE_API_KEY also accepted)
#   REBO_JWT_SECRET  when auth.mode is jwt
