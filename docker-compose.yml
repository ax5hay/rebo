# Local guinea-pig database: the JMS staging structure (no real rows), filled by tools/synth.
#   docker compose up -d db                       # first start loads the schema (about 30 s)
#   uv run --extra synth python tools/synth/synth.py   # fill it with synthetic data
#   uv run rebo bootstrap --describe        # teach the bot the structure
#   uv run rebo serve                       # http://127.0.0.1:8080/?user=alice
services:
  db:
    image: mysql:8.0.44
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: jms
    command: ["--sql-mode=NO_ENGINE_SUBSTITUTION", "--character-set-server=utf8mb4",
              "--collation-server=utf8mb4_0900_ai_ci", "--max-allowed-packet=256M"]
    ports: ["3307:3306"]
    volumes:
      - ./fixtures/jms_staging/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./tools/localdb/02-readonly-user.sql:/docker-entrypoint-initdb.d/02-readonly-user.sql:ro
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot"]
      interval: 5s
      retries: 30

  # Optional Postgres for the bot's own state (state_url), and for the Postgres test run:
  #   docker compose up -d state-db
  #   REBO_TEST_STATE_URL=postgresql://rebo:rebo@127.0.0.1:5433/rebo uv run pytest
  state-db:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_USER: rebo
      POSTGRES_PASSWORD: rebo
      POSTGRES_DB: rebo
    ports: ["5433:5432"]
    volumes: ["statedata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "rebo"]
      interval: 2s
      retries: 30

  bot:
    build: .
    profiles: ["bot"]
    env_file: .env
    environment:
      REBO_DATABASE_URL: mysql+pymysql://reports_ro:reports_ro@db:3306/jms
      REBO_STATE_DIR: /data
      OTEL_EXPORTER_OTLP_ENDPOINT: http://phoenix:6006
      OTEL_RESOURCE_ATTRIBUTES: openinference.project.name=rebo
    ports: ["8080:8080"]
    volumes: ["botstate:/data"]
    depends_on:
      db: {condition: service_healthy}

  phoenix:                                 # traces of the bot (profile bot): http://127.0.0.1:6006
    image: arizephoenix/phoenix:version-20.23.0
    profiles: ["bot"]
    ports: ["127.0.0.1:6006:6006"]

volumes:
  dbdata:
  botstate:
  statedata:
