# Production stack (B-033): the bot behind oauth2-proxy, Postgres for its memory, Phoenix for traces.
#   1. cp .env.example .env and fill in: an LLM key, REBO_DATABASE_URL (read-only user on the
#      database to report on), OAUTH2_PROXY_* (your identity provider, see oauth2-proxy docs),
#      STATE_DB_PASSWORD.
#   2. docker compose -f compose.prod.yml up -d          -> http://localhost:4180 (login first)
#   Optional local embeddings server:  --profile tei  and  REBO_EMBEDDINGS=http://tei:80
# Only the proxy is published. Phoenix (traces, on by default; prompts and rows are left out unless
# REBO_TRACE_CONTENT=true) is bound to localhost:6006.
services:
  bot:
    build: .
    env_file: ${REBO_ENV_FILE:-.env}
    environment:
      REBO_STATE_URL: postgresql://rebo:${STATE_DB_PASSWORD:-change-me}@state-db:5432/rebo
      REBO_STATE_DIR: /data
      REBO_AUTH_MODE: headers          # identity comes from oauth2-proxy (X-Forwarded-User / -Email)
      OTEL_EXPORTER_OTLP_ENDPOINT: http://phoenix:6006   # traces: agent runs, model calls, tool calls
      OTEL_RESOURCE_ATTRIBUTES: openinference.project.name=rebo
      PHOENIX_URL: http://127.0.0.1:6006       # where a browser opens traces (Phoenix is bound to localhost)
    expose: ["8080"]
    volumes: ["botdata:/data"]
    depends_on:
      state-db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 10s
      retries: 30
    restart: unless-stopped

  state-db:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_USER: rebo
      POSTGRES_PASSWORD: ${STATE_DB_PASSWORD:-change-me}
      POSTGRES_DB: rebo
    volumes: ["statedata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "rebo"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    env_file: ${REBO_ENV_FILE:-.env}   # OAUTH2_PROXY_PROVIDER, _CLIENT_ID, _CLIENT_SECRET, _COOKIE_SECRET, ...
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: http://bot:8080/
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
    ports: ["4180:4180"]
    depends_on:
      bot: {condition: service_healthy}
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:version-20.23.0
    ports: ["127.0.0.1:6006:6006"]
    volumes: ["phoenixdata:/mnt/data"]
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    restart: unless-stopped

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9   # amd64 image
    profiles: ["tei"]
    command: ["--model-id", "Snowflake/snowflake-arctic-embed-s"]
    volumes: ["teidata:/data"]
    restart: unless-stopped

volumes:
  botdata:
  statedata:
  phoenixdata:
  teidata:
